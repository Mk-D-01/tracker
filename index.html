<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="description" content="Track your AI/ML learning roadmap, phase by phase.">
  <title>AI Roadmap Tracker</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
  <script src="roadmap.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <header class="top">
    <div class="brand">
      <h1>AI Roadmap Tracker</h1>
      <p class="sub">Foundations → Core ML → LLM Engineering → Proof of Work → Hired</p>
    </div>
    <div class="stats">
      <div class="stat"><span class="stat-num" id="stat-overall">0%</span><span class="stat-label">Overall</span></div>
      <div class="stat"><span class="stat-num" id="stat-tasks">0/0</span><span class="stat-label">Tasks</span></div>
      <div class="stat"><span class="stat-num" id="stat-streak">0</span><span class="stat-label">Day streak</span></div>
    </div>
  </header>

  <div class="overall-bar"><div class="overall-fill" id="overall-fill"></div></div>

  <nav class="path" id="path" aria-label="Roadmap phases"></nav>

  <main class="layout">
    <section class="phase" id="phase"></section>

    <aside class="side">
      <div class="card">
        <h3>Activity (last 12 weeks)</h3>
        <div class="heatmap" id="heatmap"></div>
        <p class="muted small" id="last-active"></p>
      </div>

      <div class="card">
        <h3>Job-ready checklist</h3>
        <ul class="ready" id="ready"></ul>
      </div>

      <div class="card">
        <h3>Data</h3>
        <p class="muted small">Progress is saved in this browser. Export a backup now and then.</p>
        <div class="btn-row">
          <button class="btn" id="btn-export">Export</button>
          <label class="btn">Import<input type="file" id="file-import" accept="application/json,.json" hidden></label>
          <button class="btn danger" id="btn-reset">Reset</button>
        </div>
      </div>
    </aside>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
